<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>人生展櫃 | Life Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="site-header">
      <a href="#/" class="brand" aria-label="返回 LifeUp 首頁">
        <span class="brand-mark">L</span>
        <span>life<span>up</span></span>
      </a>
      <nav class="top-nav" id="topNav" aria-label="主要導覽">
        <a href="#/profile" data-nav="profile">我的展櫃</a>
        <a href="#/collection" data-nav="collection">成就圖鑑</a>
        <a href="#/badges" data-nav="badges">靈魂徽章</a>
      </nav>
      <details class="account-menu" id="accountMenu">
        <summary class="quiet-button profile-menu" id="profileMenu" aria-label="開啟帳號選單">
          <span class="mini-avatar" id="profileMiniAvatar">L</span><span class="desktop-only" id="profileMenuName">帳號</span><span aria-hidden="true">⌄</span>
        </summary>
        <div class="account-dropdown" id="accountMenuItems"></div>
      </details>
      <a class="quiet-button notification-link" id="notificationLink" href="#/notifications" hidden aria-label="通知">🔔 <span id="notificationCount">通知</span></a>
      <button class="quiet-button background-view-toggle" id="backgroundViewToggle" type="button" data-action="toggle-background-view" aria-label="顯示背景" aria-pressed="false">◉ <span>背景模式</span></button>
    </header>

    <main id="app" class="page-shell" tabindex="-1"></main>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <dialog id="entryDialog" class="entry-dialog">
      <form method="dialog" id="entryForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" id="dialogEyebrow">新增內容</p>
            <h2 id="dialogTitle">建立新系列</h2>
          </div>
          <button type="button" class="icon-button" id="closeDialog" aria-label="關閉">×</button>
        </div>
        <div id="formFields" class="form-fields"></div>
        <div class="dialog-actions">
          <button type="button" class="quiet-button" id="cancelDialog">取消</button>
          <button type="submit" class="primary-button" id="dialogSubmit">儲存</button>
        </div>
      </form>
    </dialog>

    <dialog id="profileDialog" class="entry-dialog">
      <form id="profileEditForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">PLAYER PROFILE</p>
            <h2>編輯我的展櫃</h2>
          </div>
          <button type="button" class="icon-button" id="closeProfileDialog" aria-label="關閉">×</button>
        </div>
        <div class="form-fields">
          <div class="form-field"><label for="editDisplayName">展示名稱</label><input id="editDisplayName" name="displayName" maxlength="20" required></div>
          <div class="form-field"><label for="editUsernameSlug">專屬網址名稱</label><input id="editUsernameSlug" name="usernameSlug" maxlength="30" pattern="[a-z0-9]+(-[a-z0-9]+)*" autocomplete="off" required><p class="tag-input-hint">僅使用小寫英文字母、數字與連字號；你的網址會是 /#/u/名稱</p></div>
          <div class="form-field"><label for="editIntro">一句自我介紹</label><textarea id="editIntro" name="intro" maxlength="180" required></textarea></div>
          <div class="form-field"><label for="editTags">你的關鍵字</label><input id="editTags" name="tags" maxlength="100" required><p class="tag-input-hint">用逗號分隔，最多 5 個標籤。</p></div>
          <div class="form-field"><label for="editBackground">展櫃背景</label><select id="editBackground" name="background"><option value="none">預設背景</option></select></div>
          <div class="form-field"><label for="editBackgroundColor">背景顏色</label><div class="background-color-field"><input id="editBackgroundColor" name="backgroundColor" type="color" value="#07111f"><span>可搭配背景圖片使用</span></div></div>
          <section class="showcase-editor" id="showcaseEditor" aria-labelledby="showcaseEditorTitle">
            <div class="showcase-editor-heading"><div><h3 id="showcaseEditorTitle">精選展櫃</h3><p>選擇最多兩張卡片，這些內容會顯示在公開展櫃。</p></div><button type="button" class="quiet-button" id="swapShowcaseSlots">交換位置</button></div>
            <div id="showcaseSlots"></div>
          </section>
        </div>
        <div class="dialog-actions">
          <button type="button" class="quiet-button" id="cancelProfileDialog">取消</button>
          <button type="submit" class="primary-button" id="saveProfileButton">儲存變更</button>
        </div>
      </form>
    </dialog>

    <dialog id="badgeRewardDialog" class="badge-reward-dialog" aria-labelledby="badgeRewardTitle">
      <button class="badge-reward-close icon-button" id="closeBadgeReward" type="button" aria-label="關閉">×</button>
      <div class="badge-reward-content">
        <p class="eyebrow">ACHIEVEMENT UNLOCKED</p>
        <h2 id="badgeRewardTitle">新徽章入手！</h2>
        <p class="badge-reward-subtitle">這段努力，值得被好好收藏。</p>
        <div class="badge-reward-list" id="badgeRewardList"></div>
        <button class="primary-button" id="badgeRewardDone" type="button">太棒了！</button>
      </div>
    </dialog>

    <template id="emptyStateTemplate">
      <section class="empty-state">
        <span class="empty-icon">✦</span>
        <h2>這裡還沒有內容</h2>
        <p>替這個系列加入第一個小成就吧。</p>
      </section>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="backgrounds/catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
