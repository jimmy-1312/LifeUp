<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>生活成就展櫃 | Level Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="site-header">
      <a href="#/profile" class="brand" aria-label="返回我的展櫃">
        <span class="brand-mark">L</span>
        <span>life<span>up</span></span>
      </a>
      <nav class="top-nav" aria-label="主要導覽">
        <a href="#/profile" data-nav="profile">我的展櫃</a>
        <a href="#/collection" data-nav="collection">成就圖鑑</a>
        <a href="#/badges" data-nav="badges">靈魂徽章</a>
      </nav>
      <button class="quiet-button profile-menu" type="button" id="profileMenu" aria-label="開啟帳號選單">
        <span class="mini-avatar">夏</span><span class="desktop-only">夏知念</span><span aria-hidden="true">⌄</span>
      </button>
    </header>

    <main id="app" class="page-shell" tabindex="-1"></main>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <dialog id="entryDialog" class="entry-dialog">
      <form method="dialog" id="entryForm">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" id="dialogEyebrow">新增內容</p>
            <h2 id="dialogTitle">建立新系列</h2>
          </div>
          <button type="button" class="icon-button" id="closeDialog" aria-label="關閉">×</button>
        </div>
        <div id="formFields" class="form-fields"></div>
        <div class="dialog-actions">
          <button type="button" class="quiet-button" id="cancelDialog">取消</button>
          <button type="submit" class="primary-button" id="dialogSubmit">儲存</button>
        </div>
      </form>
    </dialog>

    <template id="emptyStateTemplate">
      <section class="empty-state">
        <span class="empty-icon">✦</span>
        <h2>這裡還沒有內容</h2>
        <p>替這個系列加入第一個小成就吧。</p>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
